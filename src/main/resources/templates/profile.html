<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/commons::head}"></head>

<body>

<header th:replace="~{fragments/commons::navigation}"></header>

<div class="profile-page">
    <div class="container">
        <div class="profile-grid" th:object="${#authentication.principal}">

            <!-- Sidebar card -->
            <div class="profile-sidebar-card">
                <img th:src="@{/images/profile.jpg}" class="profile-avatar" alt="profile photo">
                <span class="profile-level-badge" th:text="#{level.__${#authentication.principal.level.name()}__}">Level</span>
                <div class="profile-name" th:text="*{fullName}">Full Name</div>
                <div class="profile-username">@<span th:text="*{username}">username</span></div>
                <div class="text-muted" style="font-size:.82rem">
                    <i class="fas fa-birthday-cake"></i>
                    <span th:text="#{profile.age}">Age</span>: <strong th:text="*{getAge()}">—</strong>
                </div>
            </div>

            <!-- Edit card -->
            <div class="profile-edit-card">

                <div th:if="${editSuccess}" class="alert-error" style="background:#d4edda; border-color:#c3e6cb; color:#155724; margin-bottom:var(--sp-lg)">
                    <i class="fas fa-check-circle"></i> <span th:text="#{profile.updated}">Profile updated successfully.</span>
                </div>
                <div th:if="${editError}" class="alert-error" style="margin-bottom:var(--sp-lg)">
                    <i class="fas fa-exclamation-circle"></i>
                    <span th:text="${editError}"></span>
                </div>

                <h3 style="font-size:1.1rem; font-weight:var(--fw-semibold); margin-bottom:var(--sp-xl); padding-bottom:var(--sp-md); border-bottom:1px solid var(--clr-border)">
                    <i class="fas fa-user-edit"></i> <span th:text="#{profile.edit-title}">Edit Profile</span>
                </h3>

                <form th:action="@{/users/profile/edit}" method="post"
                      th:object="${userEditModel}" class="form-stack">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <div class="form-field">
                        <label for="fullName" th:text="#{profile.fullname}">Full Name</label>
                        <input type="text" id="fullName"
                               th:field="*{fullName}"
                               th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'">
                        <div class="field-error" th:if="${#fields.hasErrors('fullName')}">
                            <i class="fas fa-exclamation-circle"></i>
                            <span th:errors="*{fullName}"></span>
                        </div>
                    </div>

                    <div class="form-field">
                        <label for="email" th:text="#{profile.email}">Email</label>
                        <input type="email" id="email"
                               th:field="*{email}"
                               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                        <div class="field-error" th:if="${#fields.hasErrors('email')}">
                            <i class="fas fa-exclamation-circle"></i>
                            <span th:errors="*{email}"></span>
                        </div>
                    </div>

                    <div class="form-field">
                        <label for="newPassword">
                            <span th:text="#{profile.new-password}">New Password</span>
                            <span class="text-muted" style="font-weight:400" th:text="#{profile.new-password.hint}">(leave blank to keep current)</span>
                        </label>
                        <input type="password" id="newPassword"
                               th:field="*{newPassword}"
                               th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid'"
                               autocomplete="new-password">
                        <div class="field-error" th:if="${#fields.hasErrors('newPassword')}">
                            <i class="fas fa-exclamation-circle"></i>
                            <span th:errors="*{newPassword}"></span>
                        </div>
                    </div>

                    <div class="form-field">
                        <label for="confirmPassword" th:text="#{profile.confirm-password}">Confirm New Password</label>
                        <input type="password" id="confirmPassword"
                               th:field="*{confirmPassword}"
                               th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"
                               autocomplete="new-password">
                        <div class="field-error" th:if="${#fields.hasErrors('confirmPassword')}">
                            <i class="fas fa-exclamation-circle"></i>
                            <span th:errors="*{confirmPassword}"></span>
                        </div>
                    </div>

                    <div style="display:flex; gap:var(--sp-md); margin-top:var(--sp-sm)">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> <span th:text="#{profile.save}">Save Changes</span>
                        </button>
                        <a onclick="history.back()" class="btn btn-ghost" style="cursor:pointer">
                            <i class="fas fa-arrow-left"></i> <span th:text="#{profile.back}">Back</span>
                        </a>
                    </div>
                </form>
            </div>

        </div>
    </div>
</div>

<footer th:replace="~{fragments/commons::footer}"></footer>

</body>
</html>
