<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head">
    <title>Pathfinder</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">

    <link rel="stylesheet" th:href="@{/css/api/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/custom/styles.css}"/>
    <link rel="stylesheet" th:href="@{/css/custom/mobile.css}"/>
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">

    <meta name="_csrf" th:content="${_csrf.getToken()}"/>
    <meta name="_csrf_header" th:content="${_csrf.getHeaderName()}"/>
    <meta name="page-locale" th:content="${#locale.language}"/>

    <link rel="stylesheet" th:href="@{https://use.fontawesome.com/releases/v5.15.4/css/all.css}"
          integrity="sha384-DyZ88mC6Up2uqS4h/KRgHuoeGwBcD4Ng9SiP4dIRy0EXTlnuz47vAwmeGwVChigm"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{https://unpkg.com/leaflet@1.4.0/dist/leaflet.css}"
          integrity="sha512-puBpdR0798OZvTTbP4A8Ix/l+A4dHDD0DGqYW6RQ+9jxkRFclaxxQb/SJAWZfWAkuyeQUytO7+7N4QKrDh+drA=="
          crossorigin=""/>

    <script th:src="@{/js/custom/theme-init.js}"></script>
    <script defer th:src="@{/js/api/jquery-3.5.1.slim.min.js}"></script>
    <script defer th:src="@{/js/api/bootstrap.bundle.min.js}"></script>
    <script defer th:src="@{/js/custom/theme-toggle.js}"></script>
</head>

<body>

<header th:fragment="navigation" class="site-header">
    <div class="container">

        <a th:href="@{/}" class="nav-logo">
            <div class="nav-logo-icon">
                <i class="fas fa-route"></i>
            </div>
            Pathfinder
        </a>

        <nav class="main-nav">
            <ul>
                <li><a th:href="@{/}"><i class="fas fa-home"></i> <span th:text="#{nav.home}">Home</span></a></li>
                <li><a th:href="@{/routes/all}"><i class="fas fa-map-marked-alt"></i> <span th:text="#{nav.routes}">Routes</span></a></li>
                <li sec:authorize="isAuthenticated()">
                    <a th:href="@{/routes/add}"><i class="fas fa-plus-circle"></i> <span th:text="#{nav.add-route}">Add Route</span></a>
                </li>
                <li sec:authorize="isAuthenticated()">
                    <a th:href="@{/users/profile}"><i class="fas fa-user"></i> <span th:text="#{nav.profile}">Profile</span></a>
                </li>
                <li class="nav-dropdown" sec:authorize="hasAnyRole('ADMIN', 'MODERATOR')">
                    <button class="nav-dropdown-toggle">
                        <i class="fas fa-shield-alt"></i> <span th:text="#{nav.admin}">Admin</span> <i class="fas fa-chevron-down" style="font-size:.65rem"></i>
                    </button>
                    <div class="nav-dropdown-menu">
                        <div class="nav-dropdown-menu-inner">
                        <a th:href="@{/superuser/comments}"><i class="fas fa-comments"></i> <span th:text="#{nav.admin.comments}">Comments</span></a>
                        <a sec:authorize="hasRole('ADMIN')" th:href="@{/superuser/permissions}">
                            <i class="fas fa-users-cog"></i> <span th:text="#{nav.admin.permissions}">Permissions</span>
                        </a>
                        <a sec:authorize="!hasRole('ADMIN')" href="#" class="text-muted" style="pointer-events:none">
                            <i class="fas fa-users-cog"></i> <span th:text="#{nav.admin.permissions}">Permissions</span>
                        </a>
                        </div>
                    </div>
                </li>
                <li sec:authorize="!isAuthenticated()">
                    <a th:href="@{/about}"><i class="fas fa-info-circle"></i> About</a>
                </li>
            </ul>
        </nav>

        <div class="nav-end">
            <!-- Dark mode toggle -->
            <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark mode">
                <span class="theme-toggle-track">
                    <span class="theme-toggle-thumb">
                        <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="4"/>
                            <line x1="12" y1="2" x2="12" y2="4"/>
                            <line x1="12" y1="20" x2="12" y2="22"/>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                            <line x1="2" y1="12" x2="4" y2="12"/>
                            <line x1="20" y1="12" x2="22" y2="12"/>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                        </svg>
                        <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                        </svg>
                    </span>
                </span>
            </button>

            <!-- Language switcher -->
            <div class="lang-dropdown">
                <button class="lang-dropdown-toggle" type="button" aria-label="Language">
                    <span class="lang-current-flag"
                          th:text="${#locale.language == 'bg'} ? '🇧🇬' : '🇬🇧'">🇬🇧</span>
                    <i class="fas fa-chevron-down" style="font-size:.55rem; opacity:.7"></i>
                </button>
                <div class="lang-dropdown-menu">
                    <div class="lang-dropdown-menu-inner">
                    <a th:href="@{''(lang='en')}" class="lang-option" th:classappend="${#locale.language == 'en'} ? 'lang-option-active'">
                        🇬🇧 <span>English</span>
                    </a>
                    <a th:href="@{''(lang='bg')}" class="lang-option" th:classappend="${#locale.language == 'bg'} ? 'lang-option-active'">
                        🇧🇬 <span>Български</span>
                    </a>
                    </div>
                </div>
            </div>

            <span class="nav-welcome" sec:authorize="isAuthenticated()">
                <span th:text="${#authentication.principal.getUsername()}">username</span>
            </span>

            <th:block sec:authorize="isAuthenticated()">
                <form th:action="@{/users/logout}" th:method="post" style="margin:0">
                    <button type="submit" class="btn btn-outline btn-sm">
                        <i class="fas fa-sign-out-alt"></i> <span th:text="#{nav.logout}">Logout</span>
                    </button>
                </form>
            </th:block>

            <th:block sec:authorize="!isAuthenticated()">
                <a th:href="@{/users/login}" class="btn btn-ghost btn-sm" th:text="#{nav.login}">Login</a>
                <a th:href="@{/users/register}" class="btn btn-primary btn-sm" th:text="#{nav.register}">Register</a>
            </th:block>
        </div>

    </div>
</header>

<div th:fragment="table-info"
     class="w-100 rounded border">
    <table class="table table-striped table-bordered table-hover m-0">
        <thead>
        <tr>
            <th class="col-2">User</th>
            <th class="col-7">Comment</th>
            <th class="col-1">Created</th>
            <th class="col-2">Actions</th>
        </tr>
        </thead>
    </table>
</div>

<footer th:fragment="footer" class="site-footer">
    <div class="container">
        <p>&copy; <span th:text="${#temporals.format(#temporals.createNow(), 'yyyy')}">2024</span> <span th:text="#{footer.text}">Pathfinder &mdash; Discover Bulgaria's best routes.</span></p>
    </div>
</footer>

</body>

</html>
