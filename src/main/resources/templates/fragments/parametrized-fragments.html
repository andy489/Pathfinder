<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

<!-- ================================================================
     SECTION TITLE BAR
     ================================================================ -->
<div th:fragment="title (type, count, id)"
     class="admin-section-title">
    <div class="admin-section-title__inner container">
        <span class="admin-section-title__label" th:text="${type}">Section</span>
        <span class="admin-section-title__badge" th:attr="id=${id}">
            <span th:text="${count}">0</span> total
        </span>
    </div>
</div>

<!-- ================================================================
     ACCORDION WRAPPER
     ================================================================ -->
<div th:fragment="admin-table-comments (data, approved, prefix)"
     class="admin-accordion container"
     th:attr="id=${prefix} + '-accordion-parent'">

    <!-- Empty state when no routes have comments -->
    <div th:if="${data == null or data.isEmpty()}" class="admin-empty-state">
        <i class="fas fa-comment-slash"></i>
        <p th:text="${approved} ? 'No approved comments.' : 'No pending comments.'">No comments.</p>
    </div>

    <div th:each="kv : ${data}"
         th:with="routeId=${kv.value.routeId},
                  comments=${approved} ? ${kv.value.approvedComments} : ${kv.value.newComments}"
         class="admin-accordion__item"
         th:classappend="${comments.isEmpty()} ? 'admin-accordion__item--empty' : ''"
    >

        <!-- Route header -->
        <div class="admin-accordion__header"
             th:attr="id=${prefix} + '-route-' + ${routeId}">
            <button class="admin-accordion__toggle"
                    type="button"
                    data-toggle="collapse"
                    aria-expanded="false"
                    th:attr="id='header-' + ${prefix} + '-' + ${routeId},
                             data-target='#' + ${prefix} + '-collapse-' + ${routeId},
                             aria-controls=${prefix} + '-collapse-' + ${routeId},
                             onclick=|toggleArrowComments(this.id)|">
                <span class="admin-accordion__route-name" th:text="${kv.key}">Route Name</span>
                <div class="admin-accordion__meta">
                    <span class="admin-accordion__count"
                          th:attr="id=${prefix} + '-curr-route-' + ${routeId}"
                          th:classappend="${comments.isEmpty()} ? 'admin-accordion__count--zero'"
                          th:text="${comments.size()}">0</span>
                    <span class="material-symbols-outlined admin-accordion__icon admin-accordion__icon--chevron pulse"
                          th:attr="id='chevron-arrow-' + ${prefix} + '-' + ${routeId}"
                          th:classappend="'chevron-' + ${prefix}">chevron_right</span>
                    <span class="material-symbols-outlined admin-accordion__icon admin-accordion__icon--expand pulse d-none"
                          th:attr="id='expand-arrow-' + ${prefix} + '-' + ${routeId}"
                          th:classappend="'expand-' + ${prefix}">expand_more</span>
                </div>
            </button>
        </div>

        <!-- Collapsible comment rows -->
        <div class="collapse admin-accordion__body"
             th:attr="id=${prefix} + '-collapse-' + ${routeId},
                      aria-labelledby=${prefix} + '-route-' + ${routeId},
                      data-parent='#' + ${prefix} + '-accordion-parent'">

            <div th:if="${!comments.isEmpty()}">
                <!-- Table header -->
                <div class="admin-comments-table__header">
                    <span class="admin-comments-table__col--user">User</span>
                    <span class="admin-comments-table__col--text">Comment</span>
                    <span class="admin-comments-table__col--date">Created</span>
                    <span class="admin-comments-table__col--actions">Actions</span>
                </div>

                <!-- Each comment row -->
                <div class="admin-comments-table__row"
                     th:each="c : ${comments}"
                     th:attr="id=${prefix} + '-comment-' + ${c.getCommentId()}">
                    <span class="admin-comments-table__col--user">
                        <i class="fas fa-user-circle admin-comments-table__avatar"></i>
                        <span th:text="${c.getAuthorName()}">User</span>
                    </span>
                    <span class="admin-comments-table__col--text" th:text="${c.getComment()}">Comment text</span>
                    <span class="admin-comments-table__col--date"
                          th:text="${#temporals.format(c.getCreated(), 'dd/MM/yyyy HH:mm')}">01/01/2024</span>
                    <span class="admin-comments-table__col--actions">
                        <!-- Approve (new comments only) -->
                        <div th:if="${prefix == 'new'}"
                             class="admin-btn admin-btn--approve"
                             th:attr="id=${prefix} + '-approve-' + ${c.getCommentId()},
                                      onclick=|approveRejectCommentJS(this.id, ${routeId})|">
                            <i class="fas fa-check"></i> Approve
                        </div>
                        <!-- Reject (approved comments only) -->
                        <div th:if="${prefix == 'old'}"
                             class="admin-btn admin-btn--reject"
                             th:attr="id=${prefix} + '-reject-' + ${c.getCommentId()},
                                      onclick=|approveRejectCommentJS(this.id, ${routeId})|">
                            <i class="fas fa-undo"></i> Reject
                        </div>
                        <!-- Delete (always) -->
                        <div class="admin-btn admin-btn--delete"
                             th:attr="id=${prefix} + '-delete-' + ${c.getCommentId()} + '-' + ${routeId}"
                             onclick="deleteCommentJS(this.id)">
                            <i class="fas fa-trash"></i> Delete
                        </div>
                    </span>
                </div>

                <!-- Bulk actions row -->
                <div class="admin-comments-table__bulk"
                     th:attr="id='actions-all-' + ${routeId}">
                    <div th:if="${prefix == 'new'}">
                        <button class="admin-btn admin-btn--approve admin-btn--bulk"
                                data-toggle="modal" data-target="#modal-confirm"
                                th:attr="id-transfer=${prefix} + '-reject-all-' + ${routeId}"
                                data-func="approveRejectAllCommentsJS(this.id)"
                                data-msg-action="approve"
                                th:data-route="${kv.key}">
                            <i class="fas fa-check-double"></i> Approve All
                        </button>
                    </div>
                    <div th:if="${prefix == 'old'}">
                        <button class="admin-btn admin-btn--reject admin-btn--bulk"
                                data-toggle="modal" data-target="#modal-confirm"
                                th:attr="id-transfer=${prefix} + '-reject-all-' + ${routeId}"
                                data-func="approveRejectAllCommentsJS(this.id)"
                                data-msg-action="reject"
                                th:data-route="${kv.key}">
                            <i class="fas fa-undo-alt"></i> Reject All
                        </button>
                    </div>
                    <button class="admin-btn admin-btn--delete admin-btn--bulk"
                            data-toggle="modal" data-target="#modal-confirm"
                            th:attr="id-transfer=${prefix} + '-delete-all-' + ${routeId}"
                            data-func="deleteAllCommentsJS(this.id)"
                            data-msg-action="delete"
                            th:data-route="${kv.key}">
                        <i class="fas fa-trash-alt"></i> Delete All
                    </button>
                </div>
            </div>

            <!-- Empty state inside collapse -->
            <div th:if="${comments.isEmpty()}" class="admin-accordion__no-comments">
                <i class="fas fa-comment-slash"></i> No comments for this route.
            </div>
        </div>
    </div>
</div>

<!--PERMISSIONS-->

</body>
</html>
