<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/commons::head}"></head>

<body>

<header th:replace="~{fragments/commons::navigation}"></header>

<div class="auth-page">
    <div class="auth-card">
        <div class="auth-logo">
            <div class="auth-logo-mark"><i class="fas fa-route"></i></div>
            <h1 class="auth-title" th:text="#{login.title}">Welcome back</h1>
            <p class="auth-subtitle" th:text="#{login.subtitle}">Sign in to your Pathfinder account</p>
        </div>

        <form th:action="@{/users/login}" th:method="post" class="auth-form">

            <div th:if="${bad_credentials}" class="alert-error">
                <i class="fas fa-exclamation-circle"></i> <span th:text="#{login.error}">Invalid username or password.</span>
            </div>

            <div class="form-field">
                <label for="input-username" th:text="#{login.username}">Username</label>
                <input type="text" name="username" th:value="${username}"
                       id="input-username" th:placeholder="#{login.username.placeholder}" autocomplete="username">
            </div>

            <div class="form-field">
                <label for="input-password" th:text="#{login.password}">Password</label>
                <input type="password" name="password" id="input-password"
                       placeholder="••••••••" autocomplete="current-password">
            </div>

            <div class="checkbox-row">
                <input id="remember-me" type="checkbox" name="remember-me-par">
                <label for="remember-me" th:text="#{login.remember-me}">Remember me for 1 hour</label>
            </div>

            <button class="btn btn-primary" type="submit">
                <i class="fas fa-sign-in-alt"></i> <span th:text="#{login.submit}">Sign In</span>
            </button>
        </form>

        <div class="auth-footer">
            <span th:text="#{login.no-account}">Don't have an account?</span>
            <a th:href="@{/users/register}" th:text="#{login.create}">Create one</a>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/commons::footer}"></footer>

</body>
</html>
