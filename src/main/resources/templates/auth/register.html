<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/commons::head}"></head>

<body>

<header th:replace="~{fragments/commons::navigation}"></header>

<div class="auth-page">
    <div class="auth-card" style="max-width:480px">
        <div class="auth-logo">
            <div class="auth-logo-mark"><i class="fas fa-route"></i></div>
            <h1 class="auth-title" th:text="#{register.title}">Create account</h1>
            <p class="auth-subtitle" th:text="#{register.subtitle}">Join the Pathfinder community</p>
        </div>

        <form th:action="@{/users/register}" th:method="post" th:object="${userRegistrationModel}" class="auth-form">

            <div class="form-field">
                <label for="inputUsername" th:text="#{register.username}">Username</label>
                <input th:field="*{username}"
                       th:errorclass="is-invalid"
                       type="text" id="inputUsername" th:placeholder="#{register.username.placeholder}">
                <div class="field-error" th:if="${#fields.hasErrors('username')}">
                    <i class="fas fa-exclamation-circle"></i>
                    <span th:each="err : ${#fields.errors('username')}" th:text="${err}"></span>
                </div>
            </div>

            <div class="form-field">
                <label for="inputFullName" th:text="#{register.fullname}">Full Name</label>
                <input th:field="*{fullName}"
                       th:errorclass="is-invalid"
                       type="text" id="inputFullName" th:placeholder="#{register.fullname.placeholder}">
                <div class="field-error" th:if="${#fields.hasErrors('fullName')}">
                    <i class="fas fa-exclamation-circle"></i>
                    <span th:each="err : ${#fields.errors('fullName')}" th:text="${err}"></span>
                </div>
            </div>

            <div class="form-field">
                <label for="inputEmail" th:text="#{register.email}">Email</label>
                <input th:field="*{email}"
                       th:errorclass="is-invalid"
                       type="text" id="inputEmail" th:placeholder="#{register.email.placeholder}">
                <div class="field-error" th:if="${#fields.hasErrors('email')}">
                    <i class="fas fa-exclamation-circle"></i>
                    <span th:each="err : ${#fields.errors('email')}" th:text="${err}"></span>
                </div>
            </div>

            <div class="form-field">
                <label for="inputBirthDate" th:text="#{register.birthdate}">Birth Date</label>
                <input th:field="*{birthDate}"
                       th:errorclass="is-invalid"
                       type="date" id="inputBirthDate">
                <div class="field-error" th:if="${#fields.hasErrors('birthDate')}">
                    <i class="fas fa-exclamation-circle"></i>
                    <span th:each="err : ${#fields.errors('birthDate')}" th:text="${err}"></span>
                </div>
            </div>

            <div class="form-field">
                <label for="inputPassword" th:text="#{register.password}">Password</label>
                <input th:field="*{password}"
                       th:errorclass="is-invalid"
                       type="password" id="inputPassword" th:placeholder="#{register.password.placeholder}" autocomplete="new-password">
                <div class="field-error" th:if="${#fields.hasErrors('password')}">
                    <i class="fas fa-exclamation-circle"></i>
                    <span th:each="err : ${#fields.errors('password')}" th:text="${err}"></span>
                </div>
            </div>

            <div class="form-field">
                <label for="inputConfirmPassword" th:text="#{register.confirm-password}">Confirm Password</label>
                <input th:field="*{confirmPassword}"
                       th:errorclass="is-invalid"
                       type="password" id="inputConfirmPassword" th:placeholder="#{register.confirm-password.placeholder}" autocomplete="new-password">
                <div class="field-error" th:if="${#fields.hasErrors('confirmPassword')}">
                    <i class="fas fa-exclamation-circle"></i>
                    <span th:each="err : ${#fields.errors('confirmPassword')}" th:text="${err}"></span>
                </div>
            </div>

            <button class="btn btn-primary" type="submit">
                <i class="fas fa-user-plus"></i> <span th:text="#{register.submit}">Create Account</span>
            </button>
        </form>

        <div class="auth-footer">
            <span th:text="#{register.have-account}">Already have an account?</span>
            <a th:href="@{/users/login}" th:text="#{register.sign-in}">Sign in</a>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/commons::footer}"></footer>

</body>
</html>
