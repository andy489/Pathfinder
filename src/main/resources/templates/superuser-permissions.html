<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/commons::head}"></head>

<link th:href="@{https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200}"
      rel="stylesheet"/>
<link th:href="@{/css/custom/pulse.css}" rel="stylesheet"/>
<link th:href="@{/css/custom/superuser-permissions.css}" rel="stylesheet"/>

<script defer th:src="@{/js/custom/ajax-modal-popup.js}"></script>
<script defer th:src="@{/js/custom/superuser.js}"></script>

<body class="d-flex flex-column" style="min-height:100vh">
<header th:replace="~{fragments/commons::navigation}"></header>

<main class="flex-grow-1" style="padding: var(--sp-2xl, 2rem) 0">

    <!-- Page heading -->
    <div class="container mb-4">
        <h1 class="admin-page-title">
            <i class="fas fa-user-shield"></i> User Permissions
        </h1>
        <p class="admin-page-subtitle">Manage roles and permissions for all registered users.</p>
    </div>

    <!-- Section title bar (reuse shared fragment) -->
    <div th:replace="~{fragments/parametrized-fragments::title (type='Users',
        count=${superuserUsersData.getCount()}, id='all')}"></div>

    <!-- Accordion -->
    <div class="perm-accordion container" id="accordion-parent">

        <div class="perm-accordion__item"
             th:each="kv: ${superuserUsersData.getUsersDetail()}">

            <!-- Role header -->
            <div class="perm-accordion__header"
                 th:attr="id='heading-' + ${kv.key}">
                <button class="perm-accordion__toggle"
                        type="button"
                        data-toggle="collapse"
                        aria-expanded="false"
                        th:attr="id='header-' + ${kv.key},
                                 data-target='#collapse-' + ${kv.key},
                                 aria-controls='collapse-' + ${kv.key},
                                 onclick=|toggleArrowUsers(this.id)|">

                    <span class="perm-accordion__role-name">
                        <span th:text="${#strings.capitalize(kv.key)}">Role</span>
                        <span class="perm-accordion__role-badge"
                              th:classappend="'perm-accordion__role-badge--' + ${kv.key}"
                              th:text="${#strings.capitalize(kv.key)}">Role</span>
                    </span>

                    <div class="perm-accordion__meta">
                        <!-- counter in [n] format — required by changeNumber() in superuser.js -->
                        <span class="perm-accordion__count"
                              th:attr="id='cnt-' + ${kv.key}"
                              th:text="'[' + ${#lists.size(kv.value)} + ']'">[0]</span>
                        <span class="material-symbols-outlined perm-accordion__icon pulse"
                              th:attr="id='chevron-arrow-' + ${kv.key}"
                              th:classappend="'chevron'">chevron_right</span>
                        <span class="material-symbols-outlined perm-accordion__icon pulse d-none"
                              th:attr="id='expand-arrow-' + ${kv.key}"
                              th:classappend="'expand'">expand_more</span>
                    </div>
                </button>
            </div>

            <!-- Collapsible body -->
            <div class="collapse perm-accordion__body"
                 th:attr="id='collapse-' + ${kv.key},
                          aria-labelledby='heading-' + ${kv.key},
                          data-parent='#accordion-parent'">

                <!-- Filter bar -->
                <div class="perm-filter">
                    <input th:attr="id='search-' + ${kv.key}"
                           type="text"
                           class="perm-filter__input"
                           placeholder="Filter by username…"/>
                    <button class="perm-filter__btn"
                            type="button"
                            th:attr="onclick=|filterByInfix('${kv.key}')|">
                        <i class="fas fa-search"></i> Filter
                    </button>
                </div>

                <!-- Empty state -->
                <div th:if="${kv.value.isEmpty()}" class="perm-empty-state">
                    <i class="fas fa-users-slash"></i>
                    No users in this role.
                </div>

                <div th:if="${!kv.value.isEmpty()}">
                    <!-- Table header -->
                    <div class="perm-users-table__header">
                        <span>Username</span>
                        <span>Full Name</span>
                        <span>Email</span>
                        <span>Level</span>
                        <span>Actions</span>
                    </div>

                    <!-- User rows -->
                    <div class="perm-users-table__row"
                         th:each="u: ${kv.value}"
                         th:attr="id='user-' + ${u.id()}"
                         th:classappend="'user-body-' + ${kv.key}"
                         th:data-username="${u.username()}">

                        <span class="perm-users-table__col--username">
                            <i class="fas fa-user-circle perm-users-table__avatar"></i>
                            <span th:text="${u.username()}">username</span>
                        </span>
                        <span class="perm-users-table__col--name" th:text="${u.fullName()}">Full Name</span>
                        <span class="perm-users-table__col--email" th:text="${u.email()}">email</span>
                        <span class="perm-users-table__col--level" th:text="#{level.__${u.level().name()}__}">level</span>

                        <span class="perm-users-table__col--actions">

                            <!-- ADMIN row: can demote to Moderator or Regular -->
                            <th:block th:if="${kv.key == 'admin'}">
                                <!-- self: disabled; others: active -->
                                <div th:if="${#authentication.principal.getId() == u.id()}"
                                     class="perm-btn perm-btn--disabled">
                                    <i class="fas fa-lock"></i> Self
                                </div>
                                <th:block th:if="${#authentication.principal.getId() != u.id()}">
                                    <div class="perm-btn perm-btn--to-moderator"
                                         th:attr="id=${u.id()} + '-' + ${kv.key} + '-moderator',
                                                  onclick=|changePerm(this.id)|">
                                        <i class="fas fa-user-tie"></i> Moderator
                                    </div>
                                    <div class="perm-btn perm-btn--to-regular"
                                         th:attr="id=${u.id()} + '-' + ${kv.key} + '-regular',
                                                  onclick=|changePerm(this.id)|">
                                        <i class="fas fa-user"></i> Regular
                                    </div>
                                </th:block>
                            </th:block>

                            <!-- MODERATOR row: can promote to Admin or demote to Regular -->
                            <th:block th:if="${kv.key == 'moderator'}">
                                <div class="perm-btn perm-btn--to-admin"
                                     th:attr="id=${u.id()} + '-' + ${kv.key} + '-admin',
                                              onclick=|changePerm(this.id)|">
                                    <i class="fas fa-user-shield"></i> Admin
                                </div>
                                <div class="perm-btn perm-btn--to-regular"
                                     th:attr="id=${u.id()} + '-' + ${kv.key} + '-regular',
                                              onclick=|changePerm(this.id)|">
                                    <i class="fas fa-user"></i> Regular
                                </div>
                            </th:block>

                            <!-- REGULAR row: can promote to Moderator or Admin -->
                            <th:block th:if="${kv.key == 'regular'}">
                                <div class="perm-btn perm-btn--to-moderator"
                                     th:attr="id=${u.id()} + '-' + ${kv.key} + '-moderator',
                                              onclick=|changePerm(this.id)|">
                                    <i class="fas fa-user-tie"></i> Moderator
                                </div>
                                <div class="perm-btn perm-btn--to-admin"
                                     th:attr="id=${u.id()} + '-' + ${kv.key} + '-admin',
                                              onclick=|changePerm(this.id)|">
                                    <i class="fas fa-user-shield"></i> Admin
                                </div>
                            </th:block>

                        </span>
                    </div>

                </div>
            </div>
        </div>
    </div>

</main>

<div th:replace="~{fragments/modal-popup::modal}"></div>
<footer th:replace="~{fragments/commons::footer}"></footer>

</body>
</html>
