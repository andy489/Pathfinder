<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/commons::head}"></head>

<link th:href="@{https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200}"
      rel="stylesheet"/>
<link th:href="@{/css/custom/pulse.css}" rel="stylesheet"/>
<link th:href="@{/css/custom/superuser-comments.css}" rel="stylesheet"/>

<script defer th:src="@{/js/custom/ajax-modal-popup.js}"></script>
<script defer th:src="@{/js/custom/superuser.js}"></script>

<body class="d-flex flex-column" style="min-height:100vh">
<header th:replace="~{fragments/commons::navigation}"></header>

<main class="flex-grow-1" style="padding: var(--sp-2xl, 2rem) 0">

    <!-- Page heading -->
    <div class="container mb-4">
        <h1 class="admin-page-title">
            <i class="fas fa-comments"></i> Comments Moderation
        </h1>
        <p class="admin-page-subtitle">Review, approve, reject or delete user comments across all routes.</p>
    </div>

    <!-- NEW COMMENTS -->
    <div th:replace="~{fragments/parametrized-fragments::title (type='Pending Comments',
        count=${superuserCommentsData.getNewCommentsCount()}, id='all-new-comments')}"></div>
    <div th:replace="~{fragments/parametrized-fragments::admin-table-comments (data=${superuserCommentsData.getRouteComments()},
        approved=false, prefix='new')}"></div>

    <!-- APPROVED COMMENTS -->
    <div class="mt-5"
         th:replace="~{fragments/parametrized-fragments::title (type='Approved Comments',
         count=${superuserCommentsData.getApprovedCommentsCount()}, id='all-old-comments')}"></div>
    <div th:replace="~{fragments/parametrized-fragments::admin-table-comments (data=${superuserCommentsData.getRouteComments()},
        approved=true, prefix='old')}"></div>

</main>

<div th:replace="~{fragments/modal-popup::modal}"></div>
<footer th:replace="~{fragments/commons::footer}"></footer>

</body>
</html>
